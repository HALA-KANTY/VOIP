; Compte AMI de developpement local. Le secret ci-dessous doit correspondre
; a ASTERISK_AMI_SECRET dans le .env a la racine du projet.
;
; permit large ouvert : le port 5038 n'est publie sur aucun port hote (voir
; docker-compose.override.yml), seul le reseau Docker interne y accede.

[general]
enabled = yes
port = 5038
bindaddr = 0.0.0.0
displayconnects = yes

[fastapi]
secret = dev_secret_ami
deny = 0.0.0.0/0.0.0.0
permit = 0.0.0.0/0.0.0.0
read = call,cdr,dialplan,system,command
write = call,originate,command
