; Copie locale de dev de asterisk-integration/pjsip.conf, avec le bloc NAT
; active : ici Asterisk tourne dans un conteneur Docker (reseau interne
; 172.18.0.0/16) alors que les telephones (Linphone) sont sur le LAN Wi-Fi
; de la machine hote -- il faut donc annoncer l'IP LAN de l'hote pour le
; media RTP, sinon Asterisk propose son IP interne au conteneur (injoignable
; depuis les telephones) et l'audio ne passe jamais.
;
; En production (VM Asterisk dediee, meme reseau que les postes), ce bloc
; NAT ne s'applique pas : voir asterisk-integration/pjsip.conf, qui reste la
; version de reference sans NAT.

; Pas de local_net : sous Docker Desktop (Windows), le trafic des telephones
; du LAN traverse une couche NAT interne et arrive a Asterisk avec une
; adresse source 172.18.x.x (le "routeur" du reseau Docker) -- si on
; declare ce reseau comme "local", Asterisk desactive la reecriture NAT pour
; ces pairs, alors que c'est precisement pour eux qu'elle est necessaire.
; Sans local_net, la reecriture s'applique inconditionnellement.
[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060
external_media_address = 192.168.1.172
external_signaling_address = 192.168.1.172

; --- Gabarits herites par chaque poste genere (ne pas instancier directement) ---

[endpoint-template](!)
type = endpoint
context = voip-billing          ; cf extensions-billing.conf
language = fr                   ; prompts systeme (SayNumber, etc.) en francais
disallow = all
allow = g722,ulaw,alaw,h264,vp8
direct_media = no
dtmf_mode = rfc4733
rtp_symmetric = yes
force_rport = yes

[auth-template](!)
type = auth
auth_type = userpass

[aor-template](!)
type = aor
max_contacts = 1
remove_existing = yes
qualify_frequency = 30

; Genere par le backend (GET /api/pjsip_export) directement dans le volume
; partage -- voir docker-compose.override.yml.
#include pjsip_users.conf
