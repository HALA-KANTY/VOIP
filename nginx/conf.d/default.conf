# Reverse proxy HTTP (port 80), routage par chemin sur un seul domaine :
#   /api/, /docs, /redoc, /openapi.json, /health -> backend FastAPI
#   tout le reste                                -> frontend Next.js
#
# Sert aussi le challenge ACME pour certbot. Ce fichier suffit pour la
# verification locale (docker compose up) et pour la phase 1 du deploiement
# (avant obtention des certificats). Voir DEPLOYMENT.md pour la phase 2 (TLS).

upstream backend_upstream {
    server backend:8000;
}

upstream frontend_upstream {
    server admin_web:3000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        proxy_pass http://backend_upstream;
        include /etc/nginx/proxy_params.conf;
    }

    location ~ ^/(docs|redoc|openapi\.json|health)$ {
        proxy_pass http://backend_upstream;
        include /etc/nginx/proxy_params.conf;
    }

    location / {
        proxy_pass http://frontend_upstream;
        include /etc/nginx/proxy_params.conf;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
