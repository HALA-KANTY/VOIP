; A fusionner dans /etc/asterisk/pjsip.conf sur le serveur Asterisk.
;
; Contexte : systeme telephonique interne a l'entreprise, pas de trunk PSTN,
; tous les postes (Linphone) sont sur le meme reseau que la VM Asterisk
; (192.168.100.0/24) -> pas de traversee NAT a gerer (external_media_address /
; external_signaling_address ne sont PAS necessaires ici). Si un jour des
; postes se connectent depuis l'exterieur de ce reseau, voir la note NAT
; en bas de fichier.
;
; Les postes eux-memes ne sont PAS definis ici : ils sont generes
; automatiquement depuis l'interface admin (source de verite unique) et
; synchronises par sync_pjsip.sh dans pjsip_users.conf, inclus plus bas.
; Voir README.md, section "Creer un nouvel utilisateur".

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

; --- Gabarits herites par chaque poste genere (ne pas instancier directement) ---

[endpoint-template](!)
type = endpoint
context = voip-billing          ; cf extensions-billing.conf
disallow = all
; g722 en premier : Asterisk negocie les codecs dans l'ordre de cette liste,
; donc ulaw/alaw en tete (comme avant) forcait systematiquement du son
; telephonique 8kHz meme quand les deux Linphone geraient le large bande
; (g722, 16kHz) -- ce qui plafonnait aussi la qualite de tout enregistrement
; (messagerie vocale) puisqu'on ne peut pas enregistrer mieux que ce qui est
; capte en direct.
allow = g722,ulaw,alaw,h264,vp8
direct_media = no
dtmf_mode = rfc4733
rtp_symmetric = yes
force_rport = yes

[auth-template](!)
type = auth
auth_type = userpass

[aor-template](!)
type = aor
max_contacts = 1
remove_existing = yes
qualify_frequency = 30

; Genere par sync_pjsip.sh depuis GET /api/pjsip_export -- ne pas editer ce
; fichier a la main, il est ecrase a chaque synchronisation (cron, voir
; DEPLOYMENT.md). S'il n'existe pas encore, creer un fichier vide au meme
; chemin avant le premier `asterisk -rx "pjsip reload"` :
;   sudo touch /etc/asterisk/pjsip_users.conf
#include pjsip_users.conf

; --- Note NAT (a activer seulement si des postes se connectent depuis
; l'exterieur du reseau 192.168.100.0/24) ---
; Ajouter dans [transport-udp] :
;   external_media_address = 192.168.100.11
;   external_signaling_address = 192.168.100.11
;   local_net = 192.168.100.0/24
