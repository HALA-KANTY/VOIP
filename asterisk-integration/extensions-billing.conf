#include extensions_ivr.conf

[voip-billing]

; --- MENU PRINCIPAL IVR (Extension 100) ---
; Entree directement composable ("100"). Bascule immediatement dans un
; contexte dedie (ivr-menu) pour la saisie des choix 1-4 : ce contexte ne
; contient QUE des extensions a un chiffre, donc aucune ambiguite de prefixe
; possible avec "100" (une ambiguite "1" vs "100" dans le meme contexte force
; Asterisk a attendre le timeout complet avant de reagir a la touche "1").
exten => 100,1,Answer()
 same => n,Set(SIP_ID=${CALLERID(num)})
 same => n,Set(APPEL_DESTINATION=IVR-100)
 same => n,Goto(ivr-menu,s,1)

[ivr-menu]
exten => s,1,Set(COMPTEUR=0)
 same => n(replay),Set(COMPTEUR=$[${COMPTEUR} + 1])
 same => n,Background(custom/bienvenue-ivr)
 same => n,WaitExten(5)
 same => n,GotoIf($[${COMPTEUR} < 3]?replay)

; Attendre 30 secondes supplémentaires
 same => n,WaitExten(30)
 same => n,Playback(custom/bye)
 same => n,Hangup()

; Choix de l'IVR (Touches 1 à 4) — aucune autre extension de ce contexte ne
; commence par ces chiffres : reaction instantanee, pas d'attente de timeout.
exten => 1,1,Goto(services-ivr,1001#,1)
exten => 2,1,Goto(services-ivr,1002#,1)
exten => 3,1,Goto(voip-billing,*600#,1)  ; annonce directement le solde
exten => 4,1,Goto(services-ivr,1004*,1)

; Ecouter ses messages vocaux. VMCOUNT() lit juste le nombre de messages sur
; le serveur, sans code PIN -- on annonce donc directement s'il y a quelque
; chose avant de demander le code, qui lui n'est requis que pour VoicemailMain
; (ecoute/gestion reelle). Un agent (sip_id 3xxx/4xxx/5xxx, voir PLAGES_SIP
; cote admin) n'a pas de boite personnelle utile : les messages arrivent
; dans la boite partagee de son equipe (Voicemail(commercial@...) etc dans
; generateur_dialplan.py), donc on l'y redirige au lieu de verifier sa propre
; boite (toujours vide pour un agent). PIN personnel = 4 derniers chiffres du
; sip_id ; PIN des boites d'equipe = 0000 (voir gestion_voicemail.py). Le
; Linphone recoit aussi un indicatif visuel (MWI, voir mailboxes dans
; pjsip_users.conf) -- mais uniquement pour les boites personnelles.
exten => 5,1,Answer()
 same => n,Set(MBOX=${CALLERID(num)})
 same => n,GotoIf($["${CALLERID(num):0:1}" = "3"]?commercial)
 same => n,GotoIf($["${CALLERID(num):0:1}" = "4"]?support)
 same => n,GotoIf($["${CALLERID(num):0:1}" = "5"]?comptabilite)
 same => n,Goto(suite)

 same => n(commercial),Set(MBOX=commercial)
 same => n,Goto(suite)

 same => n(support),Set(MBOX=support)
 same => n,Goto(suite)

 same => n(comptabilite),Set(MBOX=comptabilite)

 same => n(suite),Set(NB_MESSAGES=${VMCOUNT(${MBOX}@voip-billing)})
 same => n,GotoIf($[${NB_MESSAGES} > 0]?nouveaux:aucun)

 same => n(nouveaux),Playback(custom/vous-avez)
 same => n,SayNumber(${NB_MESSAGES})
 same => n,Playback(custom/nouveau-message-vocal)
 same => n,Playback(custom/entrez-code-sip)
 same => n,VoicemailMain(${MBOX}@voip-billing)
 same => n,Hangup()

 same => n(aucun),Playback(custom/aucun-nouveau-message)
 same => n,Hangup()

[voip-billing]

; --- 1. ROUTAGE DES APPELS INTERNES (Poste à Poste) ---
exten => _2XXX,1,NoOp(Appel interne ${CALLERID(num)} -> ${EXTEN})
 same => n,Set(APPEL_DESTINATION=${EXTEN})
 same => n,AGI(verifier_solde.py)
 same => n,GotoIf($["${AUTORISE}" = "1"]?autorise:refuse)

 same => n(refuse),NoOp(Solde insuffisant pour ${CALLERID(num)})
 same => n,Playback(custom/solde-insuffisant)
 same => n,Hangup(21)

 same => n(autorise),Set(SIP_ID=${CALLERID(num)})
 same => n,Dial(PJSIP/${EXTEN},60)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?fin:suite)

 ; Seul un abandon volontaire de l'appelant (CANCEL, raccroche avant que ca
 ; sonne chez l'autre) n'a pas droit a la messagerie. Tout le reste --
 ; occupe (BUSY), sonne sans reponse (NOANSWER), poste non enregistre
 ; (CHANUNAVAIL) -- propose systematiquement de laisser un message.
 same => n(suite),GotoIf($["${DIALSTATUS}" = "CANCEL"]?fin:messagerie)

 same => n(messagerie),Playback(custom/message-bip)
 same => n,Voicemail(${EXTEN}@voip-billing)
 same => n,Hangup()

 same => n(fin),Hangup()

; --- 2. CONSULTATION DU SOLDE (*600#) ---
exten => *600#,1,Answer()
 same => n,Set(SIP_ID=${CALLERID(num)})
 same => n,Set(APPEL_DESTINATION=SOLDE-600)
 same => n,AGI(verifier_solde.py)
 ; *600# ne passe jamais par Dial() : DIALSTATUS reste vide, et le "h" partage
 ; le classerait par defaut en "echoue" alors que la consultation a reussi.
 ; On force le statut de succes DES MAINTENANT (pas apres l'annonce vocale) :
 ; si l'appelant raccroche pendant/juste apres l'annonce (comportement normal),
 ; Asterisk saute direct au "h" et n'executerait jamais un Set() place plus loin.
 same => n,Set(DIALSTATUS=ANSWER)
 same => n,Playback(custom/votre-solde-est)
 same => n,Set(SOLDE_ENTIER=${CUT(SOLDE,.,1)})
 same => n,SayNumber(${SOLDE_ENTIER})
 same => n,Playback(custom/ariary)
 same => n,Set(DIALSTATUS=ANSWER)
 same => n,Hangup()

; --- 3. RECHARGE DE CRÉDIT PAR TOKEN (Composer 700 + CODE + #) ---
exten => _700.,1,Answer()
 same => n,Set(SIP_ID=${CALLERID(num)})
 same => n,Set(APPEL_DESTINATION=RECHARGE-700)
 same => n,Set(TOKEN_SAISI=${EXTEN:3})
 same => n,AGI(recharger_solde.py,${TOKEN_SAISI})
 same => n,GotoIf($["${RECHARGE_STATUT}" = "SUCCESS"]?recharge_ok:recharge_ko)

 ; Meme remarque que *600# : le statut de succes doit etre pose AVANT
 ; l'annonce vocale, pas apres -- sinon un raccroche de l'appelant pendant
 ; l'annonce empeche le Set() de s'executer.
 same => n(recharge_ok),Set(DIALSTATUS=ANSWER)
 same => n,Playback(custom/recharge-succes)
 same => n,Hangup()

 ; Ici DIALSTATUS reste volontairement vide : un token invalide/expire tombe
 ; sur le "echoue" par defaut du "h", ce qui est correct.
 same => n(recharge_ko),Playback(custom/token-invalide)
 same => n,Hangup()

; --- 4. LOG DE FIN D'APPEL AUTOMATIQUE (Extension h) ---
exten => h,1,NoOp(Fin d'appel ${SIP_ID:-inconnu} -> ${APPEL_DESTINATION} statut=${DIALSTATUS} duree=${CDR(billsec)}s)
 same => n,GotoIf($["${SIP_ID}" = ""]?fin)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?termine)
 same => n,GotoIf($["${DIALSTATUS}" = "CANCEL"]?coupe)
 same => n,GotoIf($["${DIALSTATUS}" = "BUSY"]?occupe)
 same => n,GotoIf($["${DIALSTATUS}" = "NOANSWER"]?sans_reponse)
 same => n,GotoIf($["${DIALSTATUS}" = "CHANUNAVAIL"]?hors_ligne)
 same => n,Set(STATUT_CDR=echoue)
 same => n,Goto(enregistrer)

 same => n(termine),Set(STATUT_CDR=termine)
 same => n,Goto(enregistrer)

 ; L'appelant a raccroche avant que le poste distant ne reponde.
 same => n(coupe),Set(STATUT_CDR=coupe)
 same => n,Goto(enregistrer)

 same => n(occupe),Set(STATUT_CDR=occupe)
 same => n,Goto(enregistrer)

 ; Le poste distant a sonne (donc bien enregistre/joignable) mais personne n'a decroche.
 same => n(sans_reponse),Set(STATUT_CDR=sans_reponse)
 same => n,Goto(enregistrer)

 ; Le poste distant n'est pas enregistre aupres d'Asterisk (Linphone eteint/deconnecte) :
 ; l'appel n'a jamais sonne, a distinguer d'un NOANSWER pour les statistiques.
 same => n(hors_ligne),Set(STATUT_CDR=hors_ligne)
 same => n,Goto(enregistrer)

 same => n(enregistrer),AGI(enregistrer_appel.py,${SIP_ID},${CDR(billsec)},${APPEL_DESTINATION},${STATUT_CDR})
 same => n(fin),NoOp()
