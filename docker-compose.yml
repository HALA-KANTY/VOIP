services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  backend:
    build: ./backend
    restart: unless-stopped
    # Etat en memoire (connexion AMI, compteurs temps reel) : un seul
    # conteneur/processus, jamais de scale > 1 sans revoir cette architecture.
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ASTERISK_AMI_HOST: ${ASTERISK_AMI_HOST}
      ASTERISK_AMI_PORT: ${ASTERISK_AMI_PORT}
      ASTERISK_AMI_USER: ${ASTERISK_AMI_USER}
      ASTERISK_AMI_SECRET: ${ASTERISK_AMI_SECRET}
      AMI_ENDPOINTS_SECRET: ${AMI_ENDPOINTS_SECRET}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES}
      TARIF_DEFAUT: ${TARIF_DEFAUT}
      CORS_ORIGINS: ${CORS_ORIGINS}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [internal, web]
    volumes:
      - /etc/asterisk:/etc/asterisk:rw
  admin_web:
    build:
      context: ./admin_web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks: [web]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/proxy_params.conf:/etc/nginx/proxy_params.conf:ro
      - certbot_www:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
      - admin_web
    networks: [web]

  # Ad-hoc uniquement : `docker compose run --rm certbot ...` (voir DEPLOYMENT.md).
  # N'est jamais demarre par `docker compose up`.
  certbot:
    image: certbot/certbot:latest
    profiles: ["tools"]
    volumes:
      - certbot_www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt

volumes:
  postgres_data:
  certbot_www:
  letsencrypt:
  

networks:
  internal:
  web:
